<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نگار کوانتا</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Tahoma, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }
    .chat-container {
      width: 100%;
      max-width: 650px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 90vh;
      max-height: 700px;
    }
    .chat-header {
      background: linear-gradient(135deg, #667eea, #764ba2);
      padding: 1.2rem 1.5rem;
      color: white;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .chat-header .avatar {
      width: 45px; height: 45px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
    }
    .chat-header .info h3 { font-size: 1.2rem; font-weight: 600; }
    .chat-header .info span { font-size: 0.8rem; opacity: 0.9; }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background: #f8f9fc;
    }
    .message { display: flex; gap: 0.6rem; animation: fadeIn 0.3s ease; }
    .message.user { justify-content: flex-end; }
    .message .bubble {
      max-width: 80%;
      padding: 0.9rem 1.2rem;
      border-radius: 18px;
      line-height: 1.6;
      font-size: 0.95rem;
      word-wrap: break-word;
    }
    .message.assistant .bubble {
      background: white;
      border: 1px solid #e5e7eb;
      border-bottom-right-radius: 5px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .message.user .bubble {
      background: #667eea;
      color: white;
      border-bottom-left-radius: 5px;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    .message .icon {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: #eef2ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }
    .message.user .icon { background: #667eea; color: white; order: 1; }
    .chat-input {
      padding: 1rem 1.5rem;
      background: white;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 0.8rem;
      align-items: center;
    }
    .chat-input textarea {
      flex: 1;
      resize: none;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 0.8rem 1rem;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s;
      max-height: 100px;
    }
    .chat-input textarea:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
    }
    .chat-input button {
      background: #667eea;
      border: none;
      color: white;
      width: 48px; height: 48px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1.3rem;
      transition: background 0.2s, transform 0.1s;
      flex-shrink: 0;
    }
    .chat-input button:hover { background: #5a6fd6; }
    .chat-input button:active { transform: scale(0.95); }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .typing-indicator { display: flex; gap: 0.4rem; padding: 0.5rem 1rem; }
    .typing-indicator span {
      width: 8px; height: 8px;
      background: #a0aec0;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.8); }
      40% { transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <div class="avatar">🧠</div>
      <div class="info">
        <h3>نگار کوانتا</h3>
        <span>دستیار هوشمند تحلیل متن</span>
      </div>
    </div>
    <div class="chat-messages" id="chat-box">
      <div class="message assistant">
        <div class="icon">🤖</div>
        <div class="bubble">سلام! من نگار کوانتا هستم. چطور می‌تونم کمک کنم؟</div>
      </div>
    </div>
    <div class="chat-input">
      <textarea id="userInput" rows="1" placeholder="پیام خود را بنویسید..."></textarea>
      <button onclick="sendMessage()" title="ارسال">➤</button>
    </div>
  </div>

  <input type="hidden" id="sessionId" value="demo">

  <script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('userInput');
    const sessionId = document.getElementById('sessionId').value;

    async function sendMessage() {
      const message = userInput.value.trim();
      if (!message) return;

      addMessage('user', message);
      userInput.value = '';
      userInput.style.height = 'auto';

      const typingDiv = addTypingIndicator();

      try {
        const res = await fetch('/api/chat/message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, sessionId })
        });
        const data = await res.json();
        typingDiv.remove();
        addMessage('assistant', data.response || 'پاسخی دریافت نشد.');
      } catch (err) {
        typingDiv.remove();
        addMessage('assistant', '🚫 خطا در ارتباط');
      }
    }

    function addMessage(role, text) {
      const div = document.createElement('div');
      div.className = 'message ' + role;
      const icon = role === 'user' ? '👤' : '🤖';
      div.innerHTML = `<div class="icon">${icon}</div><div class="bubble">${escapeHtml(text)}</div>`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function addTypingIndicator() {
      const div = document.createElement('div');
      div.className = 'message assistant';
      div.innerHTML = `
        <div class="icon">🤖</div>
        <div class="bubble">
          <div class="typing-indicator">
            <span></span><span></span><span></span>
          </div>
        </div>
      `;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    userInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 100) + 'px';
    });

    userInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
